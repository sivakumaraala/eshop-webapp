name: Deploy Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  deploy-webapp:
    runs-on: ubuntu-latest
    environment: production

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DEPLOY_ENV: prod
      GITOPS_OWNER: TNZR-McGaw
      GITOPS_REPO: test-microservice-gitops

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover ACR
        shell: pwsh
        run: |
          $resourceGroup = "test-microservice-$env:DEPLOY_ENV-rg"
          $acr = az acr list --resource-group $resourceGroup --query "[0]" -o json | ConvertFrom-Json
          if (-not $acr) {
            throw "No Azure Container Registry found in resource group $resourceGroup."
          }
          "ACR_NAME=$($acr.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACR_LOGIN_SERVER=$($acr.loginServer)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push webapp image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build -f src/WebApp/Dockerfile -t "$ACR_LOGIN_SERVER/webapp:$IMAGE_TAG" -t "$ACR_LOGIN_SERVER/webapp:latest" .
          docker push "$ACR_LOGIN_SERVER/webapp:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/webapp:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Checkout GitOps repo
        shell: bash
        run: |
          git clone --branch main --single-branch "https://x-access-token:${{ secrets.GITOPS_REPO_PAT }}@tnzrhub.ghe.com/${GITOPS_OWNER}/${GITOPS_REPO}.git" gitops
          cd gitops
          git checkout -b "cd/prod-webapp-${IMAGE_TAG}"

      - name: Update GitOps manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          repo = Path("gitops")
          path = repo / "environments" / "prod" / "webapp" / "deployment.yaml"
          text = path.read_text()
          old = "image: testmicroservice.azurecr.io/webapp:latest"
          new = f"image: {os.environ['ACR_LOGIN_SERVER']}/webapp:{os.environ['IMAGE_TAG']}"
          if old not in text:
              raise SystemExit(f"Expected image reference not found in {path}")
          path.write_text(text.replace(old, new))
          PY
          cd gitops
          git add environments/prod/webapp/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(prod): promote webapp to ${IMAGE_TAG}"
          git push origin "cd/prod-webapp-${IMAGE_TAG}"

      - name: Create GitOps pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITOPS_REPO_PAT }}
          script: |
            const owner = process.env.GITOPS_OWNER;
            const repo = process.env.GITOPS_REPO;
            const head = `cd/prod-webapp-${process.env.IMAGE_TAG}`;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base: 'main'
            });

            if (existing.length > 0) {
              core.info(`GitOps pull request already exists: #${existing[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base: 'main',
              title: `Promote webapp ${process.env.IMAGE_TAG} to prod`,
              body: [
                'Automated production deployment from the app repository.',
                '',
                `Image tag: ${process.env.IMAGE_TAG}`
              ].join('\n')
            });

            core.info(`Created GitOps pull request #${pr.number}: ${pr.html_url}`);
